<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROFIT FC — AI Soccer Predictions</title>
<meta name="description" content="PROFIT FC — AI-powered soccer predictions across 7 leagues. 5 ML models, 90 teams, real sportsbook odds.">
<meta property="og:title" content="PROFIT FC — AI Soccer Predictions">
<meta property="og:description" content="5 ML models. 7 leagues. Real edges the sportsbooks miss.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080d;--bg2:#0a0f17;--card:#0f1620;--card2:#16202d;--card3:#1d2938;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);
  --text:#f5f7fa;--text2:#94a3b8;--text3:#475569;
  --green:#00d97e;--green2:#34f5a0;--green3:#00a862;--green-bg:rgba(0,217,126,.10);--green-border:rgba(0,217,126,.25);--green-glow:rgba(0,217,126,.4);
  --gold:#ffd84d;--gold2:#ffe580;--gold3:#e8c220;--gold-bg:rgba(255,216,77,.10);--gold-border:rgba(255,216,77,.30);--gold-glow:rgba(255,216,77,.5);
  --blue:#3b82f6;--blue2:#60a5fa;--blue-bg:rgba(59,130,246,.08);
  --amber:#f59e0b;--amber2:#fbbf24;--amber-bg:rgba(245,158,11,.08);
  --red:#ff3860;--red-bg:rgba(255,56,96,.08);
  --purple:#a78bfa;
  --f1:'Outfit',sans-serif;--f2:'JetBrains Mono',monospace;--fd:'Bebas Neue',sans-serif;
  --r1:10px;--r2:14px;--r3:20px;
  --grid:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg);color:var(--text);font-family:var(--f1);font-size:14px;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{min-height:100vh;overflow-x:hidden;background:
  radial-gradient(ellipse 80% 50% at 50% -10%,rgba(0,217,126,.12),transparent 60%),
  radial-gradient(ellipse 70% 40% at 80% 90%,rgba(255,216,77,.06),transparent 60%),
  var(--bg)}
body::before{content:'';position:fixed;inset:0;background-image:var(--grid);background-size:48px 48px;pointer-events:none;mask:radial-gradient(ellipse 80% 80% at 50% 50%,#000 30%,transparent 80%);z-index:0}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--green3);border-radius:2px}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 30px rgba(0,217,126,.15),inset 0 1px 0 rgba(255,255,255,.04)}50%{box-shadow:0 0 60px rgba(0,217,126,.3),inset 0 1px 0 rgba(255,255,255,.08)}}
@keyframes goldglow{0%,100%{box-shadow:0 0 20px rgba(255,216,77,.2)}50%{box-shadow:0 0 40px rgba(255,216,77,.4)}}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes scan{0%{top:-2px}100%{top:100%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.fade-up{animation:fadeUp .6s cubic-bezier(.16,1,.3,1) both}
.fade-in{animation:fadeIn .5s ease both}
.stagger-1{animation-delay:.05s}.stagger-2{animation-delay:.1s}.stagger-3{animation-delay:.15s}.stagger-4{animation-delay:.2s}.stagger-5{animation-delay:.25s}.stagger-6{animation-delay:.3s}

/* Layout */
.wrap{max-width:980px;margin:0 auto;padding:0 18px;position:relative;z-index:1}

/* Live ticker */
.ticker-bar{background:linear-gradient(90deg,#000 0%,#0a0f17 50%,#000 100%);border-bottom:1px solid var(--green-border);overflow:hidden;position:relative;height:30px;display:flex;align-items:center}
.ticker-bar::before{content:'';position:absolute;left:0;top:0;bottom:0;width:80px;background:linear-gradient(90deg,#000,transparent);z-index:2}
.ticker-bar::after{content:'';position:absolute;right:0;top:0;bottom:0;width:80px;background:linear-gradient(-90deg,#000,transparent);z-index:2}
.ticker{display:flex;animation:ticker 60s linear infinite;white-space:nowrap;will-change:transform}
.ticker-item{display:inline-flex;align-items:center;gap:8px;padding:0 24px;font:600 11px var(--f2);color:var(--text2);letter-spacing:.5px}
.ticker-item .dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
.ticker-item .pick{color:var(--gold);font-weight:700}
.ticker-item .ev{color:var(--green);font-weight:700}

/* Nav */
.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 0;position:sticky;top:0;z-index:100;background:rgba(5,8,13,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:11px}
.logo-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--green3));display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 16px rgba(0,217,126,.3),inset 0 1px 0 rgba(255,255,255,.2);position:relative}
.logo-mark::after{content:'';position:absolute;inset:0;border-radius:10px;border:1px solid rgba(255,255,255,.1)}
.logo-name{font-family:var(--fd);font-size:24px;letter-spacing:1px;line-height:1}
.logo-name span{color:var(--green);text-shadow:0 0 20px var(--green-glow)}
.logo-sub{font:600 9px var(--f2);color:var(--text3);letter-spacing:2px;margin-top:1px}
.nav-btns{display:flex;gap:6px}

/* Buttons */
.btn{padding:9px 18px;border-radius:8px;font:700 12px var(--f1);cursor:pointer;transition:all .2s;border:1px solid var(--border2);background:var(--card);color:var(--text2);display:inline-flex;align-items:center;gap:6px;letter-spacing:.3px;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(255,255,255,.04),transparent);opacity:0;transition:opacity .2s}
.btn:hover::before{opacity:1}
.btn:hover{border-color:var(--text3);color:var(--text);transform:translateY(-1px)}
.btn-green{background:linear-gradient(135deg,var(--green),var(--green3));color:#000;border-color:var(--green);font-weight:800;box-shadow:0 4px 16px rgba(0,217,126,.25),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-green:hover{box-shadow:0 6px 28px rgba(0,217,126,.45),inset 0 1px 0 rgba(255,255,255,.3);transform:translateY(-2px)}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold3));color:#000;border-color:var(--gold);font-weight:800;box-shadow:0 4px 16px rgba(255,216,77,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.btn-gold:hover{box-shadow:0 6px 28px rgba(255,216,77,.5)}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:7px}

/* Hero */
.hero{text-align:center;padding:64px 0 44px;position:relative}
.hero::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(0,217,126,.08),transparent 60%);pointer-events:none;z-index:-1}
.hero-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 16px;border-radius:100px;background:var(--green-bg);border:1px solid var(--green-border);color:var(--green2);font:700 11px var(--f2);letter-spacing:1.5px;margin-bottom:22px;box-shadow:0 0 20px rgba(0,217,126,.15)}
.hero-chip::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite;box-shadow:0 0 10px var(--green)}
.hero h1{font-family:var(--fd);font-size:clamp(56px,11vw,108px);letter-spacing:1px;line-height:.9;margin-bottom:18px;text-transform:uppercase}
.hero h1 em{font-style:normal;background:linear-gradient(135deg,var(--green2),var(--gold2) 70%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 60px rgba(0,217,126,.3);position:relative;display:inline-block}
.hero h1 em::after{content:'';position:absolute;bottom:6px;left:0;right:0;height:8px;background:linear-gradient(90deg,transparent,var(--green-glow),transparent);filter:blur(8px);z-index:-1}
.hero-tag{font-family:var(--fd);font-size:18px;letter-spacing:6px;color:var(--gold);margin:-6px 0 18px;text-transform:uppercase}
.hero p{font-size:16px;color:var(--text2);max-width:520px;margin:0 auto 32px;line-height:1.65;font-weight:400}
.hero-nums{display:flex;justify-content:center;gap:8px;margin-bottom:36px;flex-wrap:wrap}
.hero-num{flex:1;min-width:90px;max-width:130px;padding:14px 8px;background:linear-gradient(180deg,var(--card),transparent);border:1px solid var(--border);border-radius:12px;text-align:center;position:relative;overflow:hidden}
.hero-num::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--green-border),transparent)}
.hero-num .n{font-family:var(--fd);font-size:36px;letter-spacing:1px;line-height:1;color:var(--green);text-shadow:0 0 20px var(--green-glow)}
.hero-num .l{font:700 9px var(--f2);color:var(--text3);letter-spacing:2px;margin-top:6px;text-transform:uppercase}
.hero-ctas{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hero-ctas .btn{padding:13px 32px;font-size:14px;border-radius:10px}

/* Cards */
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--border);border-radius:var(--r2);padding:18px;transition:all .3s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent)}
.card:hover{border-color:var(--border2);transform:translateY(-1px)}

/* Feature grid */
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 0 44px}
.feat-card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--border);border-radius:var(--r2);padding:22px;transition:all .35s;position:relative;overflow:hidden}
.feat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--green-border),transparent);opacity:0;transition:opacity .3s}
.feat-card:hover::before{opacity:1}
.feat-card:hover{border-color:var(--green-border);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,217,126,.08)}
.feat-card .icon{font-size:30px;margin-bottom:14px;display:inline-block;animation:float 4s ease-in-out infinite}
.feat-card h3{font-family:var(--fd);font-size:18px;letter-spacing:1px;margin-bottom:6px;text-transform:uppercase}
.feat-card p{font-size:12px;color:var(--text2);line-height:1.65}

/* POTD */
.potd-wrap{padding:36px 0}
.potd-label{font-family:var(--fd);font-size:14px;color:var(--gold);letter-spacing:4px;margin-bottom:14px;display:flex;align-items:center;gap:10px;text-transform:uppercase}
.potd-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--gold-border),transparent)}
.potd-label::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold-glow);animation:pulse 1.5s infinite}
.potd-card{background:
  radial-gradient(circle at 0% 0%,rgba(255,216,77,.08),transparent 50%),
  radial-gradient(circle at 100% 100%,rgba(0,217,126,.08),transparent 50%),
  linear-gradient(135deg,var(--card),var(--card2));
  border:1px solid var(--gold-border);border-radius:var(--r3);padding:26px;position:relative;overflow:hidden;animation:goldglow 3s infinite}
.potd-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.potd-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--green-border),transparent)}

/* Paywall */
.paywall{background:
  radial-gradient(ellipse at top,rgba(0,217,126,.08),transparent 60%),
  linear-gradient(180deg,var(--card),var(--bg));
  border:1px solid var(--border2);border-radius:var(--r3);padding:44px 36px;text-align:center;margin:36px 0;position:relative;overflow:hidden}
.paywall::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--green),transparent)}
.paywall h2{font-family:var(--fd);font-size:42px;letter-spacing:2px;margin-bottom:8px;text-transform:uppercase}
.paywall .price{font-family:var(--fd);font-size:88px;margin:18px 0 4px;letter-spacing:1px;line-height:1;color:var(--green);text-shadow:0 0 40px var(--green-glow)}
.paywall .price span{font-size:18px;color:var(--text2);font-weight:400;letter-spacing:1px;font-family:var(--f1)}
.paywall-pills{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:18px 0 22px}
.paywall-pill{font:700 11px var(--f2);padding:5px 12px;border-radius:100px;background:var(--green-bg);border:1px solid var(--green-border);color:var(--green2);letter-spacing:.5px}

/* Dashboard */
.dash-bar{display:flex;align-items:center;gap:6px;padding:14px 0;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.chip{padding:6px 12px;border-radius:7px;font:700 10px var(--f1);cursor:pointer;transition:all .15s;border:1px solid var(--border);background:transparent;color:var(--text3);letter-spacing:.5px;text-transform:uppercase}
.chip:hover{color:var(--text2);border-color:var(--border2)}
.chip.on{border-color:var(--green);color:var(--green);background:var(--green-bg);box-shadow:0 0 12px rgba(0,217,126,.15)}
.chip.on2{border-color:var(--gold);color:var(--gold);background:var(--gold-bg)}
.sep{width:1px;height:14px;background:var(--border);margin:0 4px}

/* Stat strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 0}
.stat{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--border);border-radius:var(--r1);padding:14px 10px;text-align:center;position:relative;overflow:hidden;transition:all .2s}
.stat::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:30%;height:1px;background:var(--green-border)}
.stat:hover{border-color:var(--border2);transform:translateY(-1px)}
.stat .v{font-family:var(--fd);font-size:30px;letter-spacing:1px;color:var(--text);line-height:1}
.stat .l{font:700 9px var(--f2);color:var(--text3);letter-spacing:2px;margin-top:6px;text-transform:uppercase}

/* Quick picks */
.qp{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--border);border-radius:var(--r1);padding:14px 16px;display:flex;align-items:center;gap:12px;transition:all .25s;position:relative;overflow:hidden}
.qp::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green);opacity:0;transition:opacity .2s}
.qp:hover::before{opacity:1}
.qp:hover{border-color:var(--green-border);transform:translateX(2px);box-shadow:-4px 0 16px rgba(0,217,126,.08)}
.qp-rank{font-family:var(--fd);font-size:28px;color:var(--gold);width:28px;text-shadow:0 0 12px var(--gold-glow)}
.qp-info{flex:1}
.qp-info .teams{font-size:13px;font-weight:700;letter-spacing:-.2px}
.qp-info .meta{font:600 10px var(--f2);color:var(--text3);margin-top:2px;letter-spacing:.5px}
.qp-pick{text-align:right}
.qp-badge{background:linear-gradient(135deg,var(--green),var(--green3));color:#000;padding:5px 14px;border-radius:7px;font:800 12px var(--f2);display:inline-block;box-shadow:0 2px 8px rgba(0,217,126,.3)}
.qp-edge{font:600 9px var(--f2);color:var(--gold);margin-top:3px;letter-spacing:.5px}

/* Parlay cards */
.par{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--border);border-radius:var(--r1);padding:14px;transition:all .2s;position:relative;overflow:hidden}
.par::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-border),transparent)}
.par:hover{border-color:var(--gold-border);transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,216,77,.06)}
.par-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.par-type{font-family:var(--fd);font-size:14px;letter-spacing:2px;color:var(--text2);text-transform:uppercase}
.par-odds{font:800 13px var(--f2);padding:4px 10px;border-radius:6px;background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-border)}
.par-leg{display:flex;justify-content:space-between;padding:5px 9px;margin-bottom:3px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:5px;font:600 10px var(--f2)}

/* Match cards */
.match{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--border);border-radius:var(--r2);padding:18px;margin-bottom:10px;transition:all .25s;position:relative;overflow:hidden}
.match::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,transparent,var(--green-border),transparent);opacity:0;transition:opacity .2s}
.match:hover::before{opacity:1}
.match:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.match-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.match-teams{font-size:16px;font-weight:800;letter-spacing:-.4px;line-height:1.3}
.match-meta{font:600 10px var(--f2);color:var(--text3);margin-top:3px;letter-spacing:.5px}
.match-tier{font:800 9px var(--f2);padding:3px 9px;border-radius:5px;display:inline-block;letter-spacing:1px}
.match-pick{text-align:right}
.match-pick-badge{padding:6px 16px;border-radius:8px;font:800 15px var(--f2);display:inline-block;color:#000;box-shadow:0 2px 8px rgba(0,217,126,.25)}
.match-pick-sub{font:600 9px var(--f2);color:var(--text3);margin-top:3px;letter-spacing:.5px}

/* Score/xG row */
.score-row{display:flex;gap:10px;margin-bottom:10px}
.score-box{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--r1);padding:9px 14px;text-align:center;min-width:68px}
.score-box .s{font:800 22px var(--f2);color:#fff;letter-spacing:-.5px}
.score-box .p{font:700 8px var(--f2);color:var(--text3);letter-spacing:1px;text-transform:uppercase}
.xg-box{flex:1;display:flex;flex-direction:column;justify-content:center}
.btts-box{text-align:center;min-width:54px;display:flex;flex-direction:column;justify-content:center}

/* Lines */
.lines-wrap{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--r1);padding:9px;margin-bottom:9px}
.line-row{display:flex;align-items:center;gap:7px;padding:5px 7px;margin-bottom:2px;border-radius:6px}
.line-row.best{background:var(--green-bg);border:1px solid var(--green-border);box-shadow:inset 0 0 8px rgba(0,217,126,.05)}
.line-num{font:800 13px var(--f2);min-width:30px;text-align:center}

/* Votes */
.vote-row{display:flex;gap:3px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.vote{font:700 8px var(--f2);padding:2px 7px;border-radius:4px;letter-spacing:.5px}

/* ML bar */
.ml-bar{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:var(--r1)}

/* Section headers */
.sec{padding:18px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sec-title{font-family:var(--fd);font-size:18px;letter-spacing:2px;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.sec-sub{font:600 10px var(--f2);color:var(--text3);letter-spacing:1px;text-transform:uppercase}

/* Tracker */
.tracker{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--border);border-radius:var(--r2);padding:16px;margin:12px 0}
.trk-row{display:flex;justify-content:space-between;padding:4px 8px;margin-bottom:2px;background:rgba(255,255,255,.02);border-radius:5px;font:600 10px var(--f2)}

/* Share card */
.share{background:
  radial-gradient(circle at top right,rgba(0,217,126,.1),transparent 50%),
  linear-gradient(135deg,#080d16,#0f1722);
  border:2px solid var(--green-border);border-radius:var(--r3);padding:24px;max-width:380px;margin:14px auto;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.share-pick{display:flex;justify-content:space-between;padding:7px 9px;margin-bottom:4px;background:rgba(255,255,255,.03);border-radius:6px;border:1px solid var(--border);font:600 10px var(--f2)}

/* Admin */
.admin{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--border);border-radius:var(--r2);padding:18px;margin:12px 0}
.admin textarea{width:100%;min-height:90px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font:12px var(--f2);padding:10px;resize:vertical}

/* Footer */
.footer{padding:48px 0 32px;border-top:1px solid var(--border);text-align:center;font:500 11px var(--f1);color:var(--text3);line-height:1.8;letter-spacing:.2px}

/* Status */
.status{padding:8px 14px;border-radius:8px;font:600 11px var(--f1);margin:8px 0;letter-spacing:.3px}
.status-ok{background:var(--green-bg);color:var(--green2);border:1px solid var(--green-border)}
.status-err{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,56,96,.2)}
.status-load{background:var(--amber-bg);color:var(--amber2);border:1px solid rgba(245,158,11,.2)}

.empty{text-align:center;padding:48px;color:var(--text3);font-family:var(--fd);font-size:18px;letter-spacing:2px;text-transform:uppercase}

/* Grid helpers */
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}

/* Responsive */
@media(max-width:640px){
  .hero{padding:48px 0 32px}
  .hero h1{font-size:64px;letter-spacing:0}
  .hero-tag{font-size:14px;letter-spacing:4px}
  .hero-nums{gap:6px}
  .hero-num{min-width:0;flex:1 1 22%;padding:10px 4px}
  .hero-num .n{font-size:24px}
  .feat-grid{grid-template-columns:1fr 1fr;gap:8px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .g2,.g3{grid-template-columns:1fr}
  .score-row{flex-wrap:wrap}
  .wrap{padding:0 12px}
  .nav{padding:12px 0}
}

/* ═══════════════════════════════════════════════════════ */
/* APPLE-STYLE LANDING — long scroll, big type, bento grid */
/* ═══════════════════════════════════════════════════════ */

/* Reveal-on-scroll */
.reveal{opacity:0;transform:translateY(30px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
.reveal.in{opacity:1;transform:translateY(0)}

/* HERO */
.apl-hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:80px 24px 60px;position:relative;overflow:hidden}
.apl-hero::before{content:'';position:absolute;top:20%;left:50%;transform:translateX(-50%);width:1100px;height:600px;background:radial-gradient(ellipse,rgba(0,217,126,.18),transparent 65%);pointer-events:none;z-index:-1}
.apl-hero::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:800px;height:300px;background:radial-gradient(ellipse,rgba(255,216,77,.08),transparent 70%);pointer-events:none;z-index:-1}
.apl-hero-inner{max-width:1100px;width:100%;animation:fadeUp 1s cubic-bezier(.16,1,.3,1) both}
.apl-eyebrow{font:700 11px var(--f2);letter-spacing:4px;color:var(--text3);margin-bottom:24px;text-transform:uppercase}
.apl-h1{font-family:var(--fd);font-size:clamp(64px,11vw,148px);letter-spacing:-1px;line-height:.92;font-weight:400;margin-bottom:24px;text-transform:none}
.apl-grad{background:linear-gradient(135deg,#34f5a0 0%,#ffd84d 50%,#ff8c5a 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:inline-block;font-style:italic}
.apl-grad-2{background:linear-gradient(135deg,#34f5a0,#22d3ee 80%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:inline-block;font-style:italic}
.apl-sub{font:500 22px var(--f1);color:var(--text2);max-width:640px;margin:0 auto 38px;line-height:1.4;letter-spacing:-.3px}
.apl-cta-row{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:60px}
.apl-cta-primary{background:linear-gradient(180deg,#fff,#e8e8e8);color:#000;border:none;padding:14px 28px;border-radius:100px;font:700 15px var(--f1);cursor:pointer;letter-spacing:-.2px;display:inline-flex;align-items:center;gap:6px;transition:all .25s;box-shadow:0 4px 20px rgba(255,255,255,.08)}
.apl-cta-primary:hover{transform:scale(1.04);box-shadow:0 8px 32px rgba(255,255,255,.18)}
.apl-cta-secondary{background:transparent;border:1px solid var(--border2);color:var(--text);padding:14px 28px;border-radius:100px;font:700 15px var(--f1);cursor:pointer;letter-spacing:-.2px;transition:all .25s}
.apl-cta-secondary:hover{border-color:var(--text2);background:var(--card)}
.apl-cta-link{background:transparent;color:var(--green2);border:none;padding:14px 8px;font:600 15px var(--f1);cursor:pointer;letter-spacing:-.2px;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.apl-cta-link:hover{color:var(--green);transform:translateX(2px)}
.apl-cta-block{width:100%;justify-content:center;margin-bottom:10px;display:flex}
.apl-arrow{display:inline-block;transition:transform .2s}
.apl-cta-primary:hover .apl-arrow,.apl-cta-link:hover .apl-arrow{transform:translateX(3px)}

/* Hero product card */
.apl-hero-product{max-width:560px;margin:0 auto;background:linear-gradient(180deg,rgba(15,22,32,.9),rgba(10,15,23,.95));border:1px solid var(--border2);border-radius:28px;padding:40px 32px;backdrop-filter:blur(20px);box-shadow:0 30px 100px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08);animation:float 6s ease-in-out infinite}
.apl-product-tag{display:inline-block;font:700 10px var(--f2);letter-spacing:2px;color:var(--green);background:var(--green-bg);border:1px solid var(--green-border);padding:5px 12px;border-radius:100px;margin-bottom:24px}
.apl-product-tag::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 1.5s infinite;box-shadow:0 0 8px var(--green)}
.apl-product-teams{font-family:var(--fd);font-size:42px;line-height:1.1;letter-spacing:1px;margin-bottom:24px;text-transform:uppercase}
.apl-product-pick{padding-top:24px;border-top:1px solid var(--border)}
.apl-pick-label{font:700 10px var(--f2);letter-spacing:2px;color:var(--text3);margin-bottom:6px}
.apl-pick-value{font-family:var(--fd);font-size:48px;letter-spacing:1px;color:var(--green);line-height:1;text-shadow:0 0 30px var(--green-glow)}
.apl-pick-edge{font:700 12px var(--f2);color:var(--gold);letter-spacing:2px;margin-top:8px}

.apl-scroll-hint{margin-top:40px;font:600 11px var(--f2);color:var(--text3);letter-spacing:3px;text-transform:uppercase;animation:float 2s ease-in-out infinite}

/* STATS BAND */
.apl-stats-band{padding:80px 24px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:linear-gradient(180deg,transparent,rgba(0,217,126,.02),transparent)}
.apl-stats-row{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.apl-stat{text-align:center;padding:20px}
.apl-stat-n{font-family:var(--fd);font-size:clamp(56px,7vw,88px);line-height:.95;background:linear-gradient(180deg,#fff,#7a8896);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-1px}
.apl-stat-n span{font-size:.55em;opacity:.6}
.apl-stat-l{font:600 13px var(--f1);color:var(--text2);margin-top:14px;line-height:1.4;letter-spacing:-.2px}

/* STATEMENT SECTIONS */
.apl-statement{max-width:1100px;margin:0 auto;padding:120px 24px;text-align:center}
.apl-statement-tag{font:700 12px var(--f2);letter-spacing:4px;color:var(--green);margin-bottom:20px;text-transform:uppercase}
.apl-statement-h{font-family:var(--fd);font-size:clamp(48px,8vw,108px);letter-spacing:-.5px;line-height:.95;font-weight:400;margin-bottom:28px;text-transform:none}
.apl-statement-p{font:500 19px var(--f1);color:var(--text2);max-width:680px;margin:0 auto;line-height:1.5;letter-spacing:-.2px}
.apl-vs{color:var(--text3);font-family:var(--f1);font-weight:300;font-size:.5em;display:inline-block;margin:.05em 0;font-style:italic;text-transform:lowercase}

/* BENTO GRID */
.apl-bento{max-width:1200px;margin:0 auto;padding:60px 24px 120px}
.apl-bento-grid{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(220px,auto);gap:14px}
.apl-tile{border-radius:24px;padding:32px;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.16,1,.3,1);cursor:default}
.apl-tile:hover{transform:translateY(-4px) scale(1.005)}
.apl-tile-large{grid-column:span 4;grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between}
.apl-tile-wide{grid-column:span 6}
.apl-tile-dark{background:linear-gradient(135deg,#0a0f17,#06090e);border:1px solid var(--border2);color:#fff}
.apl-tile-dark2{background:radial-gradient(ellipse at top right,rgba(0,217,126,.15),transparent 60%),linear-gradient(135deg,#0d1521,#070b12);border:1px solid var(--green-border);color:#fff}
.apl-tile-light{background:linear-gradient(135deg,#1a2532,#10171f);border:1px solid var(--border);color:#fff;grid-column:span 2}
.apl-tile-light2{background:linear-gradient(135deg,#1a2532,#10171f);border:1px solid var(--border);color:#fff;grid-column:span 2}
.apl-tile-green{background:linear-gradient(135deg,#00d97e,#00a862);color:#000;grid-column:span 2;display:flex;flex-direction:column;justify-content:space-between}
.apl-tile-purple{background:linear-gradient(135deg,#5b3aab,#2e1a6b);color:#fff;border:1px solid rgba(167,139,250,.25);grid-column:span 2}
.apl-tile-eyebrow{font:700 10px var(--f2);letter-spacing:3px;opacity:.7;margin-bottom:14px;text-transform:uppercase}
.apl-tile-h{font-family:var(--fd);font-size:clamp(28px,3.5vw,52px);line-height:.98;letter-spacing:-.5px;text-transform:none;font-weight:400}
.apl-tile-h-sm{font-family:var(--fd);font-size:clamp(22px,2.5vw,32px);line-height:1.05;letter-spacing:-.3px;text-transform:none;font-weight:400;margin-bottom:18px}
.apl-tile-big{font-family:var(--fd);font-size:88px;line-height:1;letter-spacing:-2px;font-weight:400}
.apl-tile-foot{font:500 13px var(--f1);opacity:.7;margin-top:16px;line-height:1.4}
.apl-tile-models{margin-top:28px;display:flex;flex-direction:column;gap:9px}
.apl-model-row{display:flex;align-items:center;gap:14px;font:600 13px var(--f1)}
.apl-model-name{min-width:120px;color:var(--text2);letter-spacing:-.2px}
.apl-model-bar{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.apl-model-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green2));border-radius:3px;animation:shimmer 3s ease-in-out infinite}
.apl-flags{margin-top:24px;font-size:32px;letter-spacing:6px;line-height:1.4}

/* PICK SECTION */
.apl-pick-section{max-width:1100px;margin:0 auto;padding:120px 24px;text-align:center}
.apl-pick-eyebrow{font:700 12px var(--f2);letter-spacing:4px;color:var(--green);margin-bottom:20px;text-transform:uppercase}
.apl-pick-eyebrow::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:8px;vertical-align:middle;animation:pulse 1.5s infinite;box-shadow:0 0 12px var(--green)}
.apl-pick-meta{font:500 16px var(--f1);color:var(--text2);margin-bottom:48px;letter-spacing:-.2px}
.apl-pick-card{max-width:760px;margin:0 auto;background:linear-gradient(180deg,rgba(15,22,32,.95),rgba(10,15,23,.95));border:1px solid var(--border2);border-radius:28px;padding:36px;text-align:left;backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.apl-pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.apl-pick-cell-l{font:700 10px var(--f2);letter-spacing:2px;color:var(--text3);margin-bottom:8px;text-transform:uppercase}
.apl-pick-cell-v{font-family:var(--fd);font-size:42px;line-height:1;letter-spacing:-.5px;color:#fff}
.apl-pick-muted{color:var(--text2)}
.apl-pct{font-size:.55em;opacity:.6}
.apl-pick-bar{margin-top:24px;height:8px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.apl-pick-bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green2),var(--gold));border-radius:4px;box-shadow:0 0 20px var(--green-glow);transition:width 1.2s cubic-bezier(.16,1,.3,1)}

/* HOW IT WORKS */
.apl-howit{max-width:1100px;margin:0 auto;padding:120px 24px;text-align:center}
.apl-steps{max-width:740px;margin:60px auto 0;text-align:left}
.apl-step{display:flex;gap:32px;padding:28px 0;border-top:1px solid var(--border);align-items:baseline}
.apl-step:last-child{border-bottom:1px solid var(--border)}
.apl-step-n{font-family:var(--fd);font-size:32px;color:var(--text3);min-width:64px;letter-spacing:1px}
.apl-step-c{flex:1}
.apl-step-t{font-family:var(--fd);font-size:32px;line-height:1.05;letter-spacing:-.3px;font-weight:400;margin-bottom:8px;text-transform:none}
.apl-step-d{font:500 16px var(--f1);color:var(--text2);line-height:1.5;letter-spacing:-.2px}

/* WORLD CUP */
.apl-wc{max-width:1100px;margin:0 auto;padding:120px 24px;text-align:center;position:relative}
.apl-wc::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:900px;height:500px;background:radial-gradient(ellipse,rgba(34,211,238,.08),transparent 65%);pointer-events:none;z-index:-1}
.apl-wc-tag{font:700 12px var(--f2);letter-spacing:4px;color:#22d3ee;margin-bottom:20px;text-transform:uppercase}

/* PRICING */
.apl-pricing{max-width:900px;margin:0 auto;padding:120px 24px;text-align:center}

.apl-pricing-features{margin-bottom:32px;display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.apl-pf{font:500 14px var(--f1);color:var(--text2);letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
.apl-pf::before{content:'';display:none}
.apl-pricing-actions{padding-top:28px;border-top:1px solid var(--border)}

/* FOOTER */
.apl-footer{max-width:1100px;margin:60px auto 0;padding:60px 24px 40px;border-top:1px solid var(--border)}
.apl-footer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-bottom:40px}
.apl-footer-h{font:700 11px var(--f2);letter-spacing:2px;color:var(--text2);margin-bottom:14px;text-transform:uppercase}
.apl-footer-col a{display:block;font:500 13px var(--f1);color:var(--text3);text-decoration:none;padding:5px 0;letter-spacing:-.2px;cursor:pointer;transition:color .2s}
.apl-footer-col a:hover{color:var(--text)}
.apl-footer-bottom{font:500 11px var(--f1);color:var(--text3);text-align:center;padding-top:24px;border-top:1px solid var(--border);letter-spacing:.5px;line-height:1.6}

/* APPLE RESPONSIVE */
@media(max-width:900px){
  .apl-bento-grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(180px,auto)}
  .apl-tile-large,.apl-tile-wide{grid-column:span 2;grid-row:span 1}
  .apl-tile-light,.apl-tile-light2,.apl-tile-green,.apl-tile-purple{grid-column:span 1}
  .apl-stats-row{grid-template-columns:repeat(2,1fr)}
  .apl-pick-grid{grid-template-columns:repeat(2,1fr)}
  .apl-footer-grid{grid-template-columns:repeat(2,1fr)}
  .apl-pricing-features{grid-template-columns:1fr}
}
@media(max-width:600px){
  .apl-hero{padding:60px 18px 40px;min-height:auto}
  .apl-h1{font-size:64px}
  .apl-sub{font-size:16px}
  .apl-product-teams{font-size:28px}
  .apl-pick-value{font-size:34px}
  .apl-statement,.apl-pick-section,.apl-howit,.apl-wc,.apl-pricing{padding:80px 18px}
  .apl-statement-h{font-size:48px}
  .apl-step{flex-direction:column;gap:8px}
  .apl-step-t{font-size:24px}
  .apl-pick-cell-v{font-size:30px}
  .apl-stat-n{font-size:54px}
  .apl-tile{padding:24px;border-radius:20px}
  .apl-tile-h{font-size:30px}
  .apl-tile-big{font-size:64px}
}

// 35-FEATURE ENGINE + 5 MODELS (all focused on goal prediction)
// ═══════════════════════════════════════════════════════════════════════════
function getT(ab){for(const lk of Object.keys(LG)){const t=LG[lk].t.find(t=>t.a===ab);if(t)return{...t,lk};}return null;}
function lAvg(lk){const ts=LG[lk]?.t;if(!ts||!ts.length)return 1.35;return ts.reduce((s,t)=>s+t.gf,0)/ts.reduce((s,t)=>s+t.g,0);}
function pSc(ab){const ps=PL[ab];if(!ps||!ps.length)return{t:.5,c:.5,s:.5};const tG=ps.reduce((s,p)=>s+p.g,0);const tA=ps.reduce((s,p)=>s+p.a,0);return{t:Math.min(1,tG/25),c:Math.min(1,tA/15),s:ps.reduce((s,p)=>s+p.f,0)/ps.length};}

function feats(hA,aA){
  const h=getT(hA),a=getT(aA);if(!h||!a)return null;
  const avg=lAvg(h.lk);const hGP=h.hw+h.hd+h.hl||1;const aGP=a.aw+a.ad+a.al||1;
  const hP=pSc(hA),aP=pSc(aA);
  const h2h=H2H[`${hA}_${aA}`];const h2hTG=h2h?(h2h.hG+h2h.aG):2.5;
  const wxK=FW[`${hA}_${aA}`];const rain=(wxK?WX[wxK]?.r:15)/100;
  return{
    hAtk:h.gf/h.g/avg,hDef:h.ga/h.g/avg,aAtk:a.gf/a.g/avg,aDef:a.ga/a.g/avg,
    hHA:h.hgf/hGP/avg,hHD:h.hga/hGP/avg,aAA:a.agf/aGP/avg,aAD:a.aga/aGP/avg,
    hF:(h.f||[.5,.5,.5,.5,.5]).reduce((s,v)=>s+v,0)/5,aF:(a.f||[.5,.5,.5,.5,.5]).reduce((s,v)=>s+v,0)/5,
    hGpg:h.gf/h.g,aGpg:a.gf/a.g,hGApg:h.ga/h.g,aGApg:a.ga/a.g,
    hCS:(h.cs||0)/h.g,aCS:(a.cs||0)/a.g,
    hxGpg:(h.xf||h.gf)/h.g,axGpg:(a.xf||a.gf)/a.g,hxGApg:(h.xa||h.ga)/h.g,axGApg:(a.xa||a.ga)/a.g,
    hThr:hP.t,aThr:aP.t,hStar:hP.s,aStar:aP.s,
    hInj:INJ[hA]?.s||0,aInj:INJ[aA]?.s||0,hCong:CONG[hA]||0,aCong:CONG[aA]||0,
    h2hTG,rain,hSP:SP[hA]?.r||.14,aSP:SP[aA]?.r||.14,
    hMot:MOT[hA]?.s||.5,aMot:MOT[aA]?.s||.5,
    hGK:GK[hA]?.g||0,aGK:GK[aA]?.g||0,
    avg,hT:h,aT:a,
  };
}

// Feature vector for goal-total ML models (35 features optimized for goal prediction)
function fVec(f){
  return[f.hAtk,f.hDef,f.aAtk,f.aDef,f.hHA,f.hHD,f.aAA,f.aAD,f.hF,f.aF,
    f.hGpg,f.aGpg,f.hGApg,f.aGApg,f.hCS,f.aCS,
    f.hxGpg/2.5,f.axGpg/2.5,f.hxGApg/2.5,f.axGApg/2.5,
    f.hThr,f.aThr,f.hStar,f.aStar,f.hInj,f.aInj,f.hCong,f.aCong,
    f.h2hTG/4,f.rain,f.hSP,f.aSP,f.hMot,f.aMot,f.hGK+.5];
}

// MODEL 1: POISSON — Full scoreline + O/U matrix
function fact(n){let r=1;for(let i=2;i<=n;i++)r*=i;return r;}
function pois(k,l){return Math.pow(l,k)*Math.exp(-l)/fact(k);}
function poissonM(hA,aA){
  const f=feats(hA,aA);if(!f)return{xG:2.5,ou:{},scores:[{h:1,a:1,p:15}],btts:50,lH:1.25,lA:1.25,hw:40,dr:30,aw:30,goalDist:[{goals:0,prob:8},{goals:1,prob:20},{goals:2,prob:28},{goals:3,prob:22},{goals:4,prob:13},{goals:5,prob:6},{goals:6,prob:2},{goals:7,prob:1}]};
  const HA=1.22;
  const hAB=f.hHA*.4+(f.hxGpg/f.avg)*.6; // heavier xG weight for goals model
  const aDB=f.aAD*.4+(f.axGApg/f.avg)*.6;
  const aAB=f.aAA*.4+(f.axGpg/f.avg)*.6;
  const hDB=f.hHD*.4+(f.hxGApg/f.avg)*.6;
  const iA=v=>(1-(v*.6));const cA=v=>(1-v);
  const h2hGM=f.h2hTG/2.5; // H2H goals multiplier
  const rn=1-f.rain*.06;const motM=v=>1+(v-.5)*.06;const gkA=v=>1+v*.5;
  const lH=hAB*aDB*f.avg*HA*(.85+f.hStar*.3)*iA(f.hInj)*cA(f.hCong)*rn*motM(f.hMot)*gkA(f.aGK)*Math.pow(h2hGM,0.3);
  const lA=aAB*hDB*f.avg/HA*(.85+f.aStar*.3)*iA(f.aInj)*cA(f.aCong)*rn*motM(f.aMot)*gkA(f.hGK)*Math.pow(h2hGM,0.3);
  const sLH=Math.max(.2,lH),sLA=Math.max(.2,lA);
  let hw=0,dr=0,aw=0;const gP={};const scores=[];
  for(let i=0;i<=8;i++)for(let j=0;j<=8;j++){const p=pois(i,sLH)*pois(j,sLA);if(i>j)hw+=p;else if(i===j)dr+=p;else aw+=p;gP[i+j]=(gP[i+j]||0)+p;scores.push({h:i,a:j,p:p*100});}
  scores.sort((a,b)=>b.p-a.p);
  const btts=scores.filter(s=>s.h>0&&s.a>0).reduce((s,v)=>s+v.p,0);
  const ou={};for(const l of[0.5,1.5,2.5,3.5,4.5,5.5]){let o=0;for(const[g,p]of Object.entries(gP))if(+g>l)o+=p;ou[l]={o:o*100,u:(1-o)*100};}
  // Goal probability distribution
  const goalDist=[];for(let g=0;g<=7;g++)goalDist.push({goals:g,prob:(gP[g]||0)*100});
  return{hw:hw*100,dr:dr*100,aw:aw*100,xG:sLH+sLA,ou,scores:scores.slice(0,6),btts,lH:sLH,lA:sLA,goalDist};
}

// MODEL 2-4: Decision Tree / Random Forest / XGBoost (trained for Over/Under 2.5)
function entropy(c,t){if(t===0)return 0;let e=0;for(const v of c)if(v>0){const p=v/t;e-=p*Math.log2(p);}return e;}
function bTree(data,dep,mD,uf){
  const c=[0,0];data.forEach(d=>c[d.o]++);const t=data.length;
  if(dep>=mD||t<6||Math.max(...c)/t>.92)return{lf:true,p:c.map(v=>v/t)};
  let bG=-1,bF=0,bT=0;const tE=entropy(c,t);
  for(const fi of uf){const vs=[...new Set(data.map(d=>d.f[fi]))].sort((a,b)=>a-b);
    for(let v=0;v<vs.length-1;v+=Math.max(1,Math.floor(vs.length/8))){const th=(vs[v]+vs[v+1])/2;const lC=[0,0],rC=[0,0];let lN=0,rN=0;
      data.forEach(d=>{if(d.f[fi]<=th){lC[d.o]++;lN++;}else{rC[d.o]++;rN++;}});
      const g=tE-(lN/t*entropy(lC,lN)+rN/t*entropy(rC,rN));if(g>bG){bG=g;bF=fi;bT=th;}}}
  if(bG<.002)return{lf:true,p:c.map(v=>v/t)};
  const l=data.filter(d=>d.f[bF]<=bT),r=data.filter(d=>d.f[bF]>bT);
  if(l.length<3||r.length<3)return{lf:true,p:c.map(v=>v/t)};
  return{lf:false,fi:bF,th:bT,l:bTree(l,dep+1,mD,uf),r:bTree(r,dep+1,mD,uf)};
}
function pT(tr,f){if(tr.lf)return tr.p;return f[tr.fi]<=tr.th?pT(tr.l,f):pT(tr.r,f);}
function sR(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}
function bForest(data,nT,mD,seed){const rng=sR(seed||42);const aF=Array.from({length:35},(_,i)=>i);const ts=[];for(let t=0;t<nT;t++){const sa=[];for(let i=0;i<data.length;i++)sa.push(data[Math.floor(rng()*data.length)]);const sh=[...aF].sort(()=>rng()-.5);ts.push(bTree(sa,0,mD,sh.slice(0,6)));}return ts;}

// MODEL 5: MONTE CARLO
function mcM(hA,aA,nS=12000){
  const f=feats(hA,aA);if(!f)return{xG:2.5,ou:{}};
  const HA=1.22;const iH=1-f.hInj*.6,iA2=1-f.aInj*.6;const cH=1-f.hCong,cA2=1-f.aCong;
  const h2hM=Math.pow(f.h2hTG/2.5,0.3);const rn=1-f.rain*.06;
  const lH=f.hHA*f.aAD*f.avg*HA*(.85+f.hStar*.3)*iH*cH*rn*h2hM*(1+f.aGK*.4);
  const lA=f.aAA*f.hHD*f.avg/HA*(.85+f.aStar*.3)*iA2*cA2*rn*h2hM*(1+f.hGK*.4);
  const fAdj=(f.hF-f.aF)*.08;const mAdj=(f.hMot-f.aMot)*.05;
  const aH=Math.max(.3,lH+fAdj+mAdj),aA3=Math.max(.3,lA-fAdj-mAdj);
  let tG=0;const gD={};
  function pS(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
  for(let s=0;s<nS;s++){const n=()=>1+(Math.random()-.5)*.1;const t=pS(aH*n())+pS(aA3*n());tG+=t;gD[t]=(gD[t]||0)+1;}
  const ou={};for(const l of[0.5,1.5,2.5,3.5,4.5,5.5]){let o=0;for(const[g,c]of Object.entries(gD))if(+g>l)o+=c;ou[l]={o:o/nS*100,u:(1-o/nS)*100};}
  return{xG:tG/nS,ou};
}

// Training data for O/U models (binary: 0=under, 1=over for line 2.5)
function buildOUData(){const data=[];for(const lk of Object.keys(LG)){const ts=LG[lk].t;for(let i=0;i<ts.length;i++)for(let j=0;j<ts.length;j++){if(i===j)continue;const f=feats(ts[i].a,ts[j].a);if(!f)continue;const totalxG=(f.hxGpg+f.axGpg)*(1-f.rain*.05)*(1-(f.hInj+f.aInj)*.15);data.push({f:fVec(f),o:totalxG>2.5?1:0});}}return data;}

// Convert American odds to implied probability (no-vig)
function amToProb(am){am=am||(-110);return am<0?Math.abs(am)/(Math.abs(am)+100)*100:100/(am+100)*100;}
function amToDecimal(am){am=am||(-110);return am<0?1+100/Math.abs(am):1+am/100;}

// Full prediction for a fixture
function predict(hA,aA,mdls,sbLines){
  const po=poissonM(hA,aA);const mc=mcM(hA,aA,12000);
  const f=feats(hA,aA);const fv=f?fVec(f):Array(35).fill(.5);
  const dtP=mdls.dt?pT(mdls.dt,fv):[.5,.5];
  const rfA=[0,0];if(mdls.rf)mdls.rf.forEach(t=>{const p=pT(t,fv);rfA[0]+=p[0];rfA[1]+=p[1];});
  const nF=mdls.rf?.length||1;const rfP=[rfA[0]/nF,rfA[1]/nF];

  // Evaluate each sportsbook line
  const linePicks=[];
  for(const sb of (sbLines||[])){
    const poO=po.ou?.[sb.l]?.o||50;const mcO=mc.ou?.[sb.l]?.o||50;
    // Blend Poisson + MC + ML (for 2.5 line also use DT/RF)
    let modelOver;
    if(sb.l===2.5){
      // Adaptive blending: when ML models agree with Poisson, give them more weight
      // When they disagree, fall back to Poisson/MC (more reliable on edge cases)
      const dtO=dtP[1]*100;const rfO=rfP[1]*100;
      const mlAvg=(dtO+rfO)/2;
      const poMcAvg=(poO+mcO)/2;
      const mlPoAgree=Math.abs(mlAvg-poMcAvg)<15; // within 15% of each other
      if(mlPoAgree){
        // Models agree — trust the blend more
        modelOver=poO*.25+mcO*.25+dtO*.20+rfO*.30;
      }else{
        // Models disagree — lean on Poisson/MC which handle outliers better
        modelOver=poO*.40+mcO*.40+dtO*.08+rfO*.12;
      }
    } else {
      modelOver=poO*.50+mcO*.50;
    }
    const modelUnder=100-modelOver;
    const sbOverImpl=amToProb(sb.oAm);const sbUnderImpl=amToProb(sb.uAm);
    // Calibration: dampen raw model signal to reflect real-world uncertainty
    // Raw model is systematically overconfident — shrink towards 50%
    // DAMP=0.42 (was 0.38) — slightly less aggressive shrinkage based on backtesting
    // Higher DAMP = more confidence in model. Lower = more conservative.
    const DAMP=0.42;
    const calOver=50+(modelOver-50)*DAMP;
    const calUnder=100-calOver;
    // Add small home-field probability bump on Poisson-only lines (1.5, 3.5, etc.)
    // since our model already accounts for HA but books often under-price big home favorites
    const evOver=(calOver/100)*amToDecimal(sb.oAm)-1;
    const evUnder=(calUnder/100)*amToDecimal(sb.uAm)-1;
    const bestDir=evOver>=evUnder?"OVER":"UNDER";
    const bestEV=Math.max(evOver,evUnder);
    const bestProb=bestDir==="OVER"?calOver:calUnder;
    const bestImpl=bestDir==="OVER"?sbOverImpl:sbUnderImpl;
    const bestAm=bestDir==="OVER"?sb.oAm:sb.uAm;
    linePicks.push({
      line:sb.l,dir:bestDir,ev:bestEV,prob:bestProb,impl:bestImpl,am:bestAm,
      oProb:calOver,uProb:calUnder,oAm:sb.oAm,uAm:sb.uAm,oImpl:sbOverImpl,uImpl:sbUnderImpl,
      evO:evOver,evU:evUnder,
    });
  }
  linePicks.sort((a,b)=>b.ev-a.ev);

  // Best pick = the 2.5 line (standard). Other lines shown as info only.
  // This prevents exotic 4.5 lines from inflating the primary recommendation.
  const primaryLP=linePicks.find(lp=>lp.line===2.5)||linePicks.find(lp=>lp.line===3.5)||linePicks[0];

  // Model agreement on primary line (2.5 or middle line)
  const primary=sbLines?.find(s=>s.l===2.5)||sbLines?.[1]||sbLines?.[0];
  const pLine=primary?.l||2.5;
  // For 2.5 line, count ALL 5 models. For other lines, only Poisson/MC have meaningful data.
  const models=[
    {n:"Poisson",over:po.ou?.[pLine]?.o||50},
    {n:"DecTree",over:pLine===2.5?dtP[1]*100:po.ou?.[pLine]?.o||50},
    {n:"Forest",over:pLine===2.5?rfP[1]*100:po.ou?.[pLine]?.o||50},
    {n:"MonteCarlo",over:mc.ou?.[pLine]?.o||50},
    {n:"Combined",over:pLine===2.5?(po.ou?.[pLine]?.o*.4+mc.ou?.[pLine]?.o*.4+dtP[1]*100*.1+rfP[1]*100*.1):(po.ou?.[pLine]?.o*.5+mc.ou?.[pLine]?.o*.5)},
  ];
  const overVotes=models.filter(m=>m.over>50).length;

  return{
    xG:(po.xG*.5+mc.xG*.5),lH:po.lH,lA:po.lA,
    linePicks,primaryLP,scores:po.scores,btts:po.btts,goalDist:po.goalDist,
    hw:po.hw,dr:po.dr,aw:po.aw,
    models,overVotes,underVotes:5-overVotes,pLine,f,
  };
}

// ═══════════════════════════════════════════════════════════════════════════
// KELLY + TIERS FOR O/U
// ═══════════════════════════════════════════════════════════════════════════
function kellyOU(modelProb,mktImpl){
  const p=modelProb/100;const q=1-p;const b=(100/mktImpl)-1;
  if(b<=0||p<=0)return 0;
  return Math.max(0,Math.min((p*b-q)/b*.25,.1));
}
function ouTier(ev,votes,edge){
  // Tightened thresholds for higher win rate (votes are now out of 5):
  // - HOT: 6%+ EV, 4+ models agreeing (80%), 4%+ edge over book
  // - STRONG: 3%+ EV, 4+ models agreeing (80%), 2%+ edge
  // - VALUE: 1%+ EV, 3+ models agreeing (60%)
  // The edge requirement filters out picks where EV is high but edge is small
  // (typically means we're betting on a longshot which historically underperforms)
  if(ev>.06&&votes>=4&&edge>=4)return{t:3,l:"🔥",c:"var(--green)",n:"🔥 HOT PICK"};
  if(ev>.03&&votes>=4&&edge>=2)return{t:2,l:"✅",c:"var(--green2)",n:"✅ STRONG"};
  if(ev>.01&&votes>=3)return{t:1,l:"📊",c:"var(--amber)",n:"📊 VALUE"};
  return{t:0,l:"—",c:"var(--text3)",n:"PASS"};
}

function parseMonth(dt){var s=(dt||"").toLowerCase();var m={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};for(var k in m)if(s.indexOf(k)>=0)return m[k];return -1;}

function runAll(){
  var d=buildOUData();var aF=Array.from({length:35},function(_,i){return i;});

      var tier=ouTier(best.ev||0,p.overVotes||0,(best.prob||50)-(best.impl||50));

      var stake=Math.round(BANKROLL*(kel||0)*100)/100;
      var potRet=Math.round(stake*amToDecimal(best.am||(-110))*100)/100;
      var ml=mlPick(p.hw||33,p.dr||34,p.aw||33,hT?hT.n:fx.h,aT?aT.n:fx.a);

        xG:p.xG||2.5,lH:p.lH||1.25,lA:p.lA||1.25,linePicks:p.linePicks||[],scores:p.scores&&p.scores.length?p.scores:[{h:1,a:1,p:15}],btts:p.btts||50,
        goalDist:p.goalDist||[],hw:p.hw||33,dr:p.dr||34,aw:p.aw||33,models:p.models||[],

}

async function loadAllMatchProps(){

  ALL_MATCH_PROPS=[];

  var upcoming=DATA.picks.filter(function(p){return p.dg!=="prev";});
  for(var i=0;i<upcoming.length;i++){
    var m=upcoming[i];

    // Use cached if exists, otherwise generate from local fallback first
    var key=m.hA+"_"+m.aA;

var API_FOOTBALL_KEY="b9a962cfd1c0e1b6ee2543f95f48f6f1"; // <-- paste your key here
var API_FOOTBALL_HOST="https://v3.football.api-sports.io";
// API-Football league IDs (different from TheSportsDB)
var APIF_LEAGUES={epl:39,la_liga:140,bundesliga:78,ligue_1:61,serie_a:135,ucl:2,uel:3};
var APIF_SEASON=2025; // current European season is 2025-26

// Smart cache — only fetch once per hour to stay well under rate limits
var APIF_CACHE_MS=3600000; // 1 hour

async function apifFetch(endpoint){
  if(!API_FOOTBALL_KEY||API_FOOTBALL_KEY==="PASTE_YOUR_KEY_HERE")return null;
  try{
    var resp=await fetch(API_FOOTBALL_HOST+endpoint,{headers:{"x-apisports-key":API_FOOTBALL_KEY}});
    if(!resp.ok)return null;
    var data=await resp.json();
    // API-Football returns errors in the body even on 200
    if(data.errors&&Object.keys(data.errors).length>0){
      
      return null;
    }
    return data.response||null;
  }catch(e){return null;}
}

// Convert API-Football date format to "Mon DD"
function apifDate(iso){
  var d=new Date(iso);if(isNaN(d))return null;
  return d.toLocaleString("en",{month:"short"})+" "+d.getDate();
}

// Convert decimal odds to American
function decToAm(dec){
  if(!dec||dec<=1)return null;
  if(dec>=2)return Math.round((dec-1)*100);
  return Math.round(-100/(dec-1));
}

// MAIN: Pull fixtures + odds from API-Football
async function fetchFromApiFootball(){
  var allFx=[];
  if(!API_FOOTBALL_KEY||API_FOOTBALL_KEY==="PASTE_YOUR_KEY_HERE")return allFx;
  // Get fixtures for next 7 days for each league
  var nowD=new Date();
  var fromDate=nowD.toISOString().split("T")[0];
  var toD=new Date(nowD.getTime()+7*24*3600*1000);
  var toDate=toD.toISOString().split("T")[0];
  for(var lk in APIF_LEAGUES){
    var fixtures=await apifFetch("/fixtures?league="+APIF_LEAGUES[lk]+"&season="+APIF_SEASON+"&from="+fromDate+"&to="+toDate);
    if(!fixtures||!fixtures.length)continue;
    fixtures.forEach(function(fx){
      var hA=mapTeam(fx.teams.home.name),aA=mapTeam(fx.teams.away.name);
      if(!hA||!aA)return;
      var dt=apifDate(fx.fixture.date);
      if(!dt)return;
      // Default odds if no odds API call (we'll add real odds in next step if quota allows)
      allFx.push({
        h:hA,a:aA,dt:dt,lg:lk,
        fxId:fx.fixture.id,
        rawDate:fx.fixture.date,
        lines:[
          {l:1.5,oAm:-200,uAm:170},
          {l:2.5,oAm:-110,uAm:-110},
          {l:3.5,oAm:190,uAm:-235}
        ]
      });
    });
  }
  return allFx;
}

// OPTIONAL: Pull real over/under odds for each fixture (uses 1 call per fixture, expensive)
// Only use this if API_FOOTBALL_KEY is paid tier or we have low fixture count
async function enrichWithOdds(fxs){
  if(!API_FOOTBALL_KEY||API_FOOTBALL_KEY==="PASTE_YOUR_KEY_HERE")return fxs;
  if(fxs.length>50)return fxs; // Skip if too many fixtures (rate limit safety)
  for(var i=0;i<fxs.length;i++){
    var fx=fxs[i];if(!fx.fxId)continue;
    var odds=await apifFetch("/odds?fixture="+fx.fxId+"&bookmaker=8"); // bookmaker 8 = Bet365
    if(!odds||!odds.length||!odds[0].bookmakers||!odds[0].bookmakers.length)continue;
    var bk=odds[0].bookmakers[0];
    var ouMkt=(bk.bets||[]).find(function(b){return b.name==="Goals Over/Under";});
    if(!ouMkt)continue;
    var lines={};
    ouMkt.values.forEach(function(v){
      var m=v.value.match(/(Over|Under)\s+([\d.]+)/);
      if(!m)return;
      var ln=parseFloat(m[2]);if(!lines[ln])lines[ln]={};
      lines[ln][m[1].toLowerCase()]=parseFloat(v.odd);
    });
    var apifLines=[];
    [1.5,2.5,3.5].forEach(function(l){
      if(lines[l]&&lines[l].over&&lines[l].under){
        apifLines.push({l:l,oAm:decToAm(lines[l].over),uAm:decToAm(lines[l].under)});
      }
    });
    if(apifLines.length>0){
      fx.lines=apifLines;
      fx.oddsSource="bet365"; // Mark as real Bet365 odds
    }
  }
  return fxs;
}

function mapTeam(name){
  if(!name)return null;
  if(TEAM_MAP[name])return TEAM_MAP[name];
  // Try partial match
  var n=name.trim();
  for(var k in TEAM_MAP){if(n.indexOf(k)>=0||k.indexOf(n)>=0)return TEAM_MAP[k];}
  // Try abbreviation directly (already abbreviated)
  if(n.length<=4&&n===n.toUpperCase()){var t=getT(n);if(t)return n;}
  return null;
}

// LIVE TRACKING — pulls in-progress match status from API-Football
// Returns: {status, hg, ag, minute, hT, aT, betStatus} for each pick
// ═══════════════════════════════════════════════════════════════════════════
async function fetchLiveMatches(){
  if(!API_FOOTBALL_KEY||API_FOOTBALL_KEY==="PASTE_YOUR_KEY_HERE")return [];
  // /fixtures?live=all returns all currently in-play matches
  var live=await apifFetch("/fixtures?live=all");
  if(!live||!live.length)return [];
  var liveMap={};
  live.forEach(function(fx){
    var hA=mapTeam(fx.teams.home.name),aA=mapTeam(fx.teams.away.name);
    if(!hA||!aA)return;
    var key=hA+"_"+aA;
    liveMap[key]={
      hg:fx.goals.home||0,
      ag:fx.goals.away||0,
      minute:fx.fixture.status.elapsed||0,
      status:fx.fixture.status.short, // 1H, HT, 2H, ET, P, FT
      statusLong:fx.fixture.status.long,
      hT:hA,
      aT:aA
    };
  });
  return liveMap;
}

// Determine if a pick is currently winning/losing/tied
function liveBetStatus(pick,live){
  if(!live)return null;
  var tG=live.hg+live.ag;
  if(pick.best.dir==="OVER"){
    if(tG>pick.best.line)return"WINNING"; // already cashed
    if(tG===pick.best.line)return"TIED-LIVE"; // need 1 more
    return"LOSING";
  }else{
    if(tG>pick.best.line)return"LOSING"; // already lost
    if(tG===pick.best.line)return"TIED-LIVE"; // needs no more goals
    return"WINNING"; // safe so far
  }
}

// PLAYER PROPS — pulls top scorers from API-Football, generates props
// ═══════════════════════════════════════════════════════════════════════════
var PLAYER_PROPS=[]; // populated by fetchPlayerProps()

async function fetchPlayerProps(){
  if(!API_FOOTBALL_KEY||API_FOOTBALL_KEY==="PASTE_YOUR_KEY_HERE")return [];
  var props=[];
  // For each league, get top 5 scorers + estimate "to score anytime" prop
  for(var lk in APIF_LEAGUES){
    try{
      var topScorers=await apifFetch("/players/topscorers?league="+APIF_LEAGUES[lk]+"&season="+APIF_SEASON);
      if(!topScorers||!topScorers.length)continue;
      topScorers.slice(0,5).forEach(function(ps){
        var p=ps.player,s=ps.statistics&&ps.statistics[0];if(!s)return;
        var games=s.games&&s.games.appearences||0;
        var goals=s.goals&&s.goals.total||0;
        if(games<5||goals<3)return; // need a sample size
        var teamName=s.team&&s.team.name||"";
        var teamA=mapTeam(teamName);if(!teamA)return;
        var t=getT(teamA);if(!t)return;
        // Probability of scoring in next match (rough estimate)
        var goalsPerGame=goals/games;
        var probScore=Math.min(78,Math.max(15,(1-Math.exp(-goalsPerGame))*100)); // poisson zero-inflated
        // Look up next fixture for this team
        var nextFx=null;
        for(var llk in LG){var f=LG[llk].fx.find(function(ff){return ff.h===teamA||ff.a===teamA;});if(f){nextFx={fx:f,lk:llk};break;}}
        if(!nextFx)return;
        // Calculate American odds from probability (book typically takes 8% margin on props)
        var bookProb=probScore-8;
        var fairAm=probScore>=50?-Math.round(probScore/(100-probScore)*100):Math.round((100-probScore)/probScore*100);
        var bookAm=bookProb>=50?-Math.round(bookProb/(100-bookProb)*100):Math.round((100-bookProb)/bookProb*100);
        var ev=(probScore/100)*(bookAm>0?bookAm/100:100/Math.abs(bookAm))-((100-probScore)/100);
        props.push({
          player:p.name,
          photo:p.photo,
          team:teamA,
          teamName:t.n,
          opp:nextFx.fx.h===teamA?nextFx.fx.a:nextFx.fx.h,
          dt:nextFx.fx.dt,
          lg:nextFx.lk,
          fl:LG[nextFx.lk].fl,
          goals:goals,games:games,
          gpg:goalsPerGame.toFixed(2),
          prob:probScore.toFixed(0),
          bookOdds:bookAm,
          ev:(ev*100).toFixed(1),
          tier:ev>0.06?3:ev>0.03?2:ev>0?1:0
        });
      });
    }catch(e){}
  }
  PLAYER_PROPS=props.sort(function(a,b){return parseFloat(b.ev)-parseFloat(a.ev);});
  return PLAYER_PROPS;
}

// TEAM STATS REFRESH — pulls live W/D/L, goals, recent form from API-Football
// Updates the LG[league].t[] array so the model uses CURRENT team data.
// Cached 6 hours per team (form changes match-by-match, not minute-by-minute).
// ═══════════════════════════════════════════════════════════════════════════
async function fetchTeamStats(teamAbbr,leagueKey){
  if(!API_FOOTBALL_KEY||API_FOOTBALL_KEY==="PASTE_YOUR_KEY_HERE")return null;
  var teamId=APIF_TEAM_IDS[teamAbbr];if(!teamId)return null;
  var leagueId=APIF_LEAGUES[leagueKey];if(!leagueId)return null;
  // Cache 6hrs per team
  var cacheKey="profitfc-stats-"+teamId+"-"+leagueId;
  var cached=localStorage.getItem(cacheKey);
  var cacheTime=localStorage.getItem(cacheKey+"-time");
  if(cached&&cacheTime&&(Date.now()-parseInt(cacheTime))<21600000){
    try{return JSON.parse(cached);}catch(e){}
  }
  var stats=await apifFetch("/teams/statistics?team="+teamId+"&league="+leagueId+"&season="+APIF_SEASON);
  if(!stats||!stats.fixtures)return null;
  // Parse the stats into our internal team format
  // API returns: fixtures.played, fixtures.wins, fixtures.draws, fixtures.loses (each with home/away/total)
  // goals.for/against.total.total/home/away
  // form: string like "WWDLW" — last 5 matches, most recent last
  var f=stats.fixtures;var g=stats.goals;
  var formStr=stats.form||"";
  var formArr=formStr.slice(-5).split("").map(function(c){return c==="W"?1:c==="D"?0.5:0;});
  while(formArr.length<5)formArr.unshift(0.5); // pad with draws if <5 games played
  var parsed={
    n:stats.team&&stats.team.name||teamAbbr,a:teamAbbr,
    g:f.played&&f.played.total||0,
    w:f.wins&&f.wins.total||0,d:f.draws&&f.draws.total||0,l:f.loses&&f.loses.total||0,
    p:(f.wins&&f.wins.total||0)*3+(f.draws&&f.draws.total||0),
    gf:g.for&&g.for.total&&g.for.total.total||0,
    ga:g.against&&g.against.total&&g.against.total.total||0,
    hw:f.wins&&f.wins.home||0,hd:f.draws&&f.draws.home||0,hl:f.loses&&f.loses.home||0,
    hgf:g.for&&g.for.total&&g.for.total.home||0,
    hga:g.against&&g.against.total&&g.against.total.home||0,
    aw:f.wins&&f.wins.away||0,ad:f.draws&&f.draws.away||0,al:f.loses&&f.loses.away||0,
    agf:g.for&&g.for.total&&g.for.total.away||0,
    aga:g.against&&g.against.total&&g.against.total.away||0,
    f:formArr,
    cs:stats.clean_sheet&&stats.clean_sheet.total||0
  };
  // Estimate xF/xA if not provided (API-Football's free tier doesn't have xG)
  // Use goals as proxy: xF ≈ goals scored, xA ≈ goals conceded
  parsed.xf=parsed.gf*0.95;
  parsed.xa=parsed.ga*0.95;
  parsed.ps=Math.min(95,Math.max(35,(parsed.w/Math.max(1,parsed.g))*100+30)); // power score proxy
  try{
    localStorage.setItem(cacheKey,JSON.stringify(parsed));
    localStorage.setItem(cacheKey+"-time",Date.now().toString());
  }catch(e){}
  return parsed;
}

// Refresh team stats for all teams in upcoming fixtures
// Runs in background after fixtures load — non-blocking
async function refreshAllTeamStats(){
  if(!API_FOOTBALL_KEY||API_FOOTBALL_KEY==="PASTE_YOUR_KEY_HERE")return;
  // Collect unique teams across all upcoming fixtures
  var teamsToRefresh=new Set();
  for(var lk in LG){
    if(lk==="wc2026")continue;
    var fx=LG[lk].fx||[];
    fx.forEach(function(f){
      teamsToRefresh.add(lk+":"+f.h);
      teamsToRefresh.add(lk+":"+f.a);
    });
  }
  var refreshed=0;
  for(var entry of teamsToRefresh){
    var parts=entry.split(":");
    var leagueKey=parts[0],teamAbbr=parts[1];
    try{
      var newStats=await fetchTeamStats(teamAbbr,leagueKey);
      if(newStats){
        // Find the team in LG and update fields
        var lg=LG[leagueKey];if(!lg||!lg.t)continue;
        var existingTeam=lg.t.find(function(t){return t.a===teamAbbr;});
        if(existingTeam){
          // Merge updated stats while preserving the team object reference
          ["g","w","d","l","p","gf","ga","hw","hd","hl","hgf","hga","aw","ad","al","agf","aga","f","cs","xf","xa","ps"].forEach(function(k){
            if(newStats[k]!==undefined)existingTeam[k]=newStats[k];
          });
          refreshed++;
        }
      }
    }catch(e){}
  }
  if(refreshed>0){
    // Re-run the model with fresh data
    DATA=runAll();
    if(MODE==="app"||MODE==="props")rerender();
  }
  return refreshed;
}

// Fetch a team's full roster + season stats from API-Football
async function fetchTeamRoster(teamAbbr){
  var teamId=APIF_TEAM_IDS[teamAbbr];if(!teamId)return null;
  // Cache
  var cacheKey="profitfc-roster-v3-"+teamId;
  var cached=localStorage.getItem(cacheKey);
  var cacheTime=localStorage.getItem(cacheKey+"-time");
  if(cached&&cacheTime&&(Date.now()-parseInt(cacheTime))<86400000){
    try{return JSON.parse(cached);}catch(e){}
  }
  // /players?team=X&season=Y returns paginated. Page 1 has top 20 players.
  var players=await apifFetch("/players?team="+teamId+"&season="+APIF_SEASON+"&page=1");
  if(!players||!players.length)return null;
  var roster=players.map(function(pp){
    var p=pp.player,s=(pp.statistics&&pp.statistics[0])||{};
    return {
      id:p.id,name:p.name,photo:p.photo,
      pos:s.games&&s.games.position||"",
      apps:s.games&&s.games.appearences||0,
      mins:s.games&&s.games.minutes||0,
      goals:s.goals&&s.goals.total||0,
      assists:s.goals&&s.goals.assists||0,
      shots:s.shots&&s.shots.total||0,
      shotsOnT:s.shots&&s.shots.on||0,
      saves:s.goals&&s.goals.saves||0,
      teamApiId:s.team&&s.team.id||null
    };
  // ─── ROSTER FILTER ───
  // Filters out:
  // 1. Players with insufficient playing time (transferred mid-season, injured all year, academy)
  // 2. Players whose stat record is for a different team (e.g., loan/transfer)
  // 3. Players in the known-departed blocklist (API sometimes lags reality)
  }).filter(function(p){
    // Must have meaningful playing time — both criteria, not either
    if(p.apps<5||p.mins<200)return false;
    // Stats must be for the team we're querying, not a previous club
    if(p.teamApiId&&p.teamApiId!==teamId)return false;
    // Hard blocklist for confirmed departed players the API still lists incorrectly
    if(DEPARTED_PLAYERS.indexOf(p.name)>=0)return false;
    return true;
  });
  try{
    localStorage.setItem(cacheKey,JSON.stringify(roster));
    localStorage.setItem(cacheKey+"-time",Date.now().toString());
  }catch(e){} // localStorage might be full
  TEAM_ROSTERS[teamId]=roster;
  return roster;
}

// Generate prop probability/EV from a player's per-game rate
// rate = stat per game, line = the prop line (e.g., 1.5 shots), bookMargin = vig %
function calcProp(rate,line,bookMargin){
  if(!rate||rate<=0)return null;
  // Poisson probability of stat > line
  var lam=rate;
  var probOver=0;
  for(var k=Math.ceil(line);k<=20;k++){
    probOver+=Math.pow(lam,k)*Math.exp(-lam)/factorial(k);
  }
  probOver=Math.min(95,Math.max(5,probOver*100));
  // Book typically inflates the line by margin
  var bookProb=probOver-bookMargin;
  if(bookProb<5)bookProb=5;if(bookProb>95)bookProb=95;
  var bookAm=bookProb>=50?-Math.round(bookProb/(100-bookProb)*100):Math.round((100-bookProb)/bookProb*100);
  var ev=(probOver/100)*(bookAm>0?bookAm/100:100/Math.abs(bookAm))-((100-probOver)/100);
  return {prob:probOver,bookAm:bookAm,ev:ev*100,tier:ev>0.06?3:ev>0.03?2:ev>0?1:0};
}
function factorial(n){if(n<=1)return 1;var r=1;for(var i=2;i<=n;i++)r*=i;return r;}

// Generate all 5 prop types for a single fixture (home + away players)
async function generateMatchProps(homeAbbr,awayAbbr){
  var key=homeAbbr+"_"+awayAbbr;
  // Check if we have REAL cached props (not just the loading state)
  if(MATCH_PROPS[key]&&!MATCH_PROPS[key].loading&&(MATCH_PROPS[key].goalscorer.length||MATCH_PROPS[key].assist.length))return MATCH_PROPS[key];
  var hRoster=await fetchTeamRoster(homeAbbr);
  var aRoster=await fetchTeamRoster(awayAbbr);
  if(!hRoster&&!aRoster)return null;
  var allPlayers=[].concat(hRoster||[],aRoster||[]).filter(function(p){return p.apps>=4&&p.mins>=200;});
  var props={goalscorer:[],assist:[],shots:[],sot:[],saves:[]};
  allPlayers.forEach(function(p){
    var team=hRoster&&hRoster.indexOf(p)>=0?homeAbbr:awayAbbr;
    var teamName=getT(team)?getT(team).n:team;
    // ── Anytime Goalscorer ──
    if(p.goals>=2&&p.pos!=="Goalkeeper"){
      var gpg=p.goals/p.apps;
      // Probability ANY goal = 1 - P(0 goals)
      var probG=Math.min(78,Math.max(8,(1-Math.exp(-gpg))*100));
      var bookProb=probG-7;
      var bookAm=bookProb>=50?-Math.round(bookProb/(100-bookProb)*100):Math.round((100-bookProb)/bookProb*100);
      var ev=(probG/100)*(bookAm>0?bookAm/100:100/Math.abs(bookAm))-((100-probG)/100);
      props.goalscorer.push({player:p.name,photo:p.photo,team:team,teamName:teamName,pos:p.pos,goals:p.goals,apps:p.apps,gpg:gpg.toFixed(2),prob:probG.toFixed(0),bookAm:bookAm,ev:(ev*100).toFixed(1),tier:ev>0.06?3:ev>0.03?2:ev>0?1:0});
    }
    // ── Anytime Assist ──
    if(p.assists>=2&&p.pos!=="Goalkeeper"){
      var apg=p.assists/p.apps;
      var probA=Math.min(70,Math.max(6,(1-Math.exp(-apg))*100));
      var bookProbA=probA-7;
      var bookAmA=bookProbA>=50?-Math.round(bookProbA/(100-bookProbA)*100):Math.round((100-bookProbA)/bookProbA*100);
      var evA=(probA/100)*(bookAmA>0?bookAmA/100:100/Math.abs(bookAmA))-((100-probA)/100);
      props.assist.push({player:p.name,photo:p.photo,team:team,teamName:teamName,pos:p.pos,assists:p.assists,apps:p.apps,apg:apg.toFixed(2),prob:probA.toFixed(0),bookAm:bookAmA,ev:(evA*100).toFixed(1),tier:evA>0.06?3:evA>0.03?2:evA>0?1:0});
    }
    // ── Shots Over 1.5 ──
    if(p.shots>=8&&p.pos!=="Goalkeeper"){
      var spg=p.shots/p.apps;
      var c=calcProp(spg,1.5,8);
      if(c&&c.prob>30)props.shots.push({player:p.name,photo:p.photo,team:team,teamName:teamName,pos:p.pos,shots:p.shots,apps:p.apps,spg:spg.toFixed(2),line:1.5,prob:c.prob.toFixed(0),bookAm:c.bookAm,ev:c.ev.toFixed(1),tier:c.tier});
    }
    // ── Shots on Target Over 0.5 ──
    if(p.shotsOnT>=5&&p.pos!=="Goalkeeper"){
      var sotpg=p.shotsOnT/p.apps;
      var c2=calcProp(sotpg,0.5,8);
      if(c2&&c2.prob>30)props.sot.push({player:p.name,photo:p.photo,team:team,teamName:teamName,pos:p.pos,sot:p.shotsOnT,apps:p.apps,sotpg:sotpg.toFixed(2),line:0.5,prob:c2.prob.toFixed(0),bookAm:c2.bookAm,ev:c2.ev.toFixed(1),tier:c2.tier});
    }
    // ── GK Saves Over 2.5 ──
    if(p.pos==="Goalkeeper"&&p.saves>=10){
      var savpg=p.saves/p.apps;
      var c3=calcProp(savpg,2.5,9);
      if(c3&&c3.prob>20)props.saves.push({player:p.name,photo:p.photo,team:team,teamName:teamName,pos:"GK",saves:p.saves,apps:p.apps,savpg:savpg.toFixed(2),line:2.5,prob:c3.prob.toFixed(0),bookAm:c3.bookAm,ev:c3.ev.toFixed(1),tier:c3.tier});
    }
  });
  // Sort each category by EV descending
  ["goalscorer","assist","shots","sot","saves"].forEach(function(k){
    props[k].sort(function(a,b){return parseFloat(b.ev)-parseFloat(a.ev);});
  });
  MATCH_PROPS[key]=props;
  return props;
}

// FALLBACK: generate props from the PL data already in the model
// This works WITHOUT the API — uses our hardcoded player stats
function generatePropsFromLocalData(homeAbbr,awayAbbr){
  var props={loading:false,goalscorer:[],assist:[],shots:[],sot:[],saves:[],source:"local"};
  // Helper for realistic book margin (longshots have heavier vig + odds caps)
  function calcPropEv(prob){
    var margin=prob<10?20:prob<20?15:prob<35?10:7;
    var bookProb=Math.max(8,prob-margin);
    var bookAm=bookProb>=50?-Math.round(bookProb/(100-bookProb)*100):Math.round((100-bookProb)/bookProb*100);
    if(bookAm>1000)bookAm=1000;
    var ev=(prob/100)*(bookAm>0?bookAm/100:100/Math.abs(bookAm))-((100-prob)/100);
    if(ev>0.30)ev=0.30;
    return{bookAm:bookAm,ev:ev*100,tier:ev>0.06?3:ev>0.03?2:ev>0?1:0};
  }
  // Goalkeeper names per team (so saves prop has someone to show)
  // We estimate saves from team's goals-against rate (worse defense = more shots faced = more saves)
  var GK_MAP={
    ARS:"Raya",MCI:"Donnarumma",MUN:"Onana",LFC:"Alisson",CFC:"Sanchez",TOT:"Vicario",AVL:"Martinez",NEW:"Pope",BRI:"Verbruggen",WHU:"Areola",EVE:"Pickford",FUL:"Leno",BOU:"Kepa",CRY:"Henderson",BRE:"Flekken",NFO:"Sels",WOL:"Sa",BUR:"Trafford",LEE:"Meslier",SUN:"Patterson",
    BAR:"ter Stegen",RMA:"Courtois",ATM:"Oblak",VIL:"Tenas",RBB:"Vieites",SEV:"Nyland",RSO:"Remiro",ATH:"S.Simon",OSA:"Herrera",RCC:"Radu",GET:"Soria",ESP:"Garcia",VCF:"Mamardashvili",GIR:"Gazzaniga",MAL:"Roman",ALA:"Sivera",ELC:"Dituro",RVC:"Batalla",LVT:"Cardenas",OVI:"Aaron",
    BMU:"Neuer",BVB:"Kobel",VFB:"Nubel",RBL:"Gulacsi",LEV:"Hradecky",SGE:"Trapp",SCF:"Atubolu",TSG:"Baumann",M05:"Zentner",BMG:"Nicolas",SVW:"Zetterer",KOE:"Schwabe",UNI:"Rönnow",WOB:"Grabara",FCA:"Dahmen",HSV:"Heuer Fernandes",STP:"Vasilj",FCH:"Müller",
    PSG:"Donnarumma",OL:"Perri",OLM:"de Lange",LIL:"Chevalier",ASM:"Köhn",RCL:"Samba",REN:"Mandanda",NIC:"Bulka",TFC:"Restes",FCN:"Lopes",STB:"Bizot",ANG:"Koffi",FCL:"Mannone",RCS:"Penders",AUX:"Léon",FCM:"Oukidja",HAC:"Diaw",PFC:"Trapp",
    INT:"Sommer",ACM:"Maignan",NAP:"Meret",JUV:"Di Gregorio",ROM:"Svilar",ATA:"Carnesecchi",LAZ:"Provedel",BFC:"Skorupski",FIO:"De Gea",TOR:"Milinkovic-Savic",GEN:"Leali",UDI:"Sava",CAG:"Caprile",PAR:"Suzuki",LEC:"Falcone",VER:"Montipo",SAS:"Muric",COM:"Butez",CRE:"Audero",PIS:"Semper",
    SPO:"Israel",POR:"Diogo Costa",BRA:"Hornicek"
  };
  [homeAbbr,awayAbbr].forEach(function(teamAbbr){
    var t=getT(teamAbbr);if(!t)return;
    var teamName=t.n;
    var roster=PL[teamAbbr]||[];
    roster.forEach(function(p){
      if(!p||!p.n)return;
      // ── GOALSCORER ──
      if(p.g&&p.g>=2){
        var gpg=p.g/28;
        var probG=Math.min(75,Math.max(10,(1-Math.exp(-gpg))*100));
        var c=calcPropEv(probG);
        props.goalscorer.push({player:p.n,photo:null,team:teamAbbr,teamName:teamName,pos:"",goals:p.g,apps:28,gpg:gpg.toFixed(2),prob:probG.toFixed(0),bookAm:c.bookAm,ev:c.ev.toFixed(1),tier:c.tier});
      }
      // ── ASSIST ──
      if(p.a&&p.a>=2){
        var apg=p.a/28;
        var probA=Math.min(65,Math.max(8,(1-Math.exp(-apg))*100));
        var cA=calcPropEv(probA);
        props.assist.push({player:p.n,photo:null,team:teamAbbr,teamName:teamName,pos:"",assists:p.a,apps:28,apg:apg.toFixed(2),prob:probA.toFixed(0),bookAm:cA.bookAm,ev:cA.ev.toFixed(1),tier:cA.tier});
      }
      // ── SHOTS Over 1.5 (estimated from goals: avg striker takes ~6 shots per goal scored) ──
      if(p.g&&p.g>=2){
        // Shots per game = goals/game × 6 (16% conversion rate is typical)
        var spg=(p.g/28)*6;
        // Probability of 2+ shots using Poisson
        var lam=spg;var pZero=Math.exp(-lam);var pOne=lam*Math.exp(-lam);
        var probShots=Math.min(85,Math.max(20,(1-pZero-pOne)*100));
        var cS=calcPropEv(probShots);
        props.shots.push({player:p.n,photo:null,team:teamAbbr,teamName:teamName,pos:"",shots:Math.round(spg*28),apps:28,spg:spg.toFixed(2),line:1.5,prob:probShots.toFixed(0),bookAm:cS.bookAm,ev:cS.ev.toFixed(1),tier:cS.tier});
      }
      // ── SHOTS ON TARGET Over 0.5 (estimated: ~40% of shots are on target) ──
      if(p.g&&p.g>=2){
        var spg2=(p.g/28)*6;
        var sotpg=spg2*0.4; // 40% accuracy is league average
        // Probability of 1+ shot on target
        var probSot=Math.min(82,Math.max(20,(1-Math.exp(-sotpg))*100));
        var cSot=calcPropEv(probSot);
        props.sot.push({player:p.n,photo:null,team:teamAbbr,teamName:teamName,pos:"",sot:Math.round(sotpg*28),apps:28,sotpg:sotpg.toFixed(2),line:0.5,prob:probSot.toFixed(0),bookAm:cSot.bookAm,ev:cSot.ev.toFixed(1),tier:cSot.tier});
      }
    });
    // ── GK SAVES Over 2.5 (one goalkeeper per team, estimated from team's defensive load) ──
    var gkName=GK_MAP[teamAbbr];
    if(gkName&&t.ga&&t.g){
      // Estimate saves per game from defensive workload:
      // - Goals against per game (gapg) tells us how often the GK gets beaten
      // - GK faces ~3-5 shots per goal allowed (most shots get saved or miss)
      // - So saves per game ≈ shots faced - goals = (gapg × 4) - gapg = gapg × 3
      var gapg=t.ga/t.g;
      var savpg=Math.max(2.0,Math.min(5.5,gapg*3+1)); // baseline 1 save + 3 saves per goal allowed
      // Probability of 3+ saves (Poisson)
      var lam2=savpg;
      var probSaves=0;
      for(var k=3;k<=15;k++){
        var fact=1;for(var i=2;i<=k;i++)fact*=i;
        probSaves+=Math.pow(lam2,k)*Math.exp(-lam2)/fact;
      }
      probSaves=Math.min(85,Math.max(30,probSaves*100));
      var cSv=calcPropEv(probSaves);
      props.saves.push({player:gkName,photo:null,team:teamAbbr,teamName:teamName,pos:"GK",saves:Math.round(savpg*28),apps:28,savpg:savpg.toFixed(2),line:2.5,prob:probSaves.toFixed(0),bookAm:cSv.bookAm,ev:cSv.ev.toFixed(1),tier:cSv.tier});
    }
  });
  // Sort each category by probability
  ["goalscorer","assist","shots","sot","saves"].forEach(function(k){
    props[k].sort(function(a,b){return parseFloat(b.prob)-parseFloat(a.prob);});
  });
  return props;
}

// AUTO-GRADING (UPGRADED) — uses API-Football for accuracy
// ═══════════════════════════════════════════════════════════════════════════
async function autoGradeFromApiFootball(){
  if(!API_FOOTBALL_KEY||API_FOOTBALL_KEY==="PASTE_YOUR_KEY_HERE")return 0;
  var graded=0,oW=0,oT=0,mW=0,mT=0,pW=0,pT=0,bW=0,bT=0;
  var d2=buildOUData();var aF2=Array.from({length:35},function(_,i){return i;});
  var md2={dt:bTree(d2,0,7,aF2),rf:bForest(d2,45,5,42)};
  // Get last 7 days of finished matches per league
  var nowD=new Date();
  var weekAgo=new Date(nowD.getTime()-7*24*3600*1000);
  var fromDate=weekAgo.toISOString().split("T")[0];
  var toDate=nowD.toISOString().split("T")[0];
  for(var lk in APIF_LEAGUES){
    try{
      var fx=await apifFetch("/fixtures?league="+APIF_LEAGUES[lk]+"&season="+APIF_SEASON+"&from="+fromDate+"&to="+toDate+"&status=FT");
      if(!fx)continue;
      fx.forEach(function(m){
        var hA=mapTeam(m.teams.home.name),aA=mapTeam(m.teams.away.name);
        if(!hA||!aA)return;
        var hg=m.goals.home,ag=m.goals.away;
        if(hg==null||ag==null)return;
        // Skip if already graded
        var already=TRK.hist.some(function(h){return h.h===hA&&h.a===aA&&h.hg===hg&&h.ag===ag;});
        if(already)return;
        var p2=predict(hA,aA,md2,[{l:1.5,oAm:-200,uAm:170},{l:2.5,oAm:-110,uAm:-110},{l:3.5,oAm:190,uAm:-235}]);
        if(!p2)return;
        var tG=hg+ag;
        var b2=(p2.linePicks&&p2.linePicks[0])||{line:2.5,dir:"OVER",ev:0,prob:50,impl:50};
        var t2=ouTier(b2.ev||0,p2.overVotes||0,(b2.prob||50)-(b2.impl||50));
        var lp25=p2.linePicks?p2.linePicks.find(function(l){return l.line===2.5;}):null;
        if(lp25){var mD=(lp25.oProb||50)>(lp25.uProb||50)?"OVER":"UNDER";var aD=tG>2.5?"OVER":"UNDER";oT++;if(mD===aD)oW++;}
        var mlD2=(p2.hw||0)>(p2.aw||0)?((p2.hw||0)>(p2.dr||0)?"H":"D"):((p2.aw||0)>(p2.dr||0)?"A":"D");
        var aML=hg>ag?"H":(hg<ag?"A":"D");mT++;if(mlD2===aML)mW++;
        if(t2.t>=2){pT++;var ouHit=b2.dir==="OVER"?tG>b2.line:tG<b2.line;if(ouHit)pW++;}
        var mB=(p2.btts||50)>50;var aB=hg>0&&ag>0;bT++;if(mB===aB)bW++;
        TRK.hist.push({h:hA,a:aA,hg:hg,ag:ag,ouPick:b2.dir+" "+b2.line,ouHit:b2.dir==="OVER"?tG>b2.line:tG<b2.line,mlPick:mlD2,mlHit:mlD2===aML,tier:t2.t,date:m.fixture.date.split("T")[0]});
        graded++;
      });
    }catch(e){}
  }
  TRK.ouT+=oT;TRK.ouW+=oW;TRK.mlT+=mT;TRK.mlW+=mW;TRK.prT+=pT;TRK.prW+=pW;TRK.btT+=bT;TRK.btW+=bW;
  saveTrk();
  return graded;
}

          if(!p2)return;
          var tG=hg+ag;var b2=(p2.linePicks&&p2.linePicks[0])||{line:2.5,dir:"OVER",ev:0,prob:50,impl:50};
          var t2=ouTier(b2.ev||0,p2.overVotes||0,(b2.prob||50)-(b2.impl||50));
          var lp25=p2.linePicks?p2.linePicks.find(function(l){return l.line===2.5;}):null;
          if(lp25){var mD=(lp25.oProb||50)>(lp25.uProb||50)?"OVER":"UNDER";var aD=tG>2.5?"OVER":"UNDER";oT++;if(mD===aD)oW++;}
          var mlD2=(p2.hw||0)>(p2.aw||0)?((p2.hw||0)>(p2.dr||0)?"H":"D"):((p2.aw||0)>(p2.dr||0)?"A":"D");
          var aML=hg>ag?"H":(hg<ag?"A":"D");mT++;if(mlD2===aML)mW++;
          if(t2.t>=2){pT++;if(b2.dir==="OVER"?tG>b2.line:tG<b2.line)pW++;}
          var mB=(p2.btts||50)>50;var aB=hg>0&&ag>0;bT++;if(mB===aB)bW++;ck++;
          TRK.hist.push({h:hA,a:aA,hg:hg,ag:ag,ouPick:b2.dir+" "+b2.line,ouHit:b2.dir==="OVER"?tG>b2.line:tG<b2.line,mlPick:mlD2,mlHit:mlD2===aML,tier:t2.t,date:ev.dateEvent||new Date().toISOString().split("T")[0]});
        });
      }catch(e){}
    }
    TRK.ouT+=oT;TRK.ouW+=oW;TRK.mlT+=mT;TRK.mlW+=mW;TRK.prT+=pT;TRK.prW+=pW;TRK.btT+=bT;TRK.btW+=bW;
    saveTrk();
    STATUS=ck+" results updated";
    TRACKER_VIEW=true;rerender();
    setTimeout(function(){STATUS="";rerender();},2500);
  }catch(e){STATUS="";rerender();}
}

// ═══ ADMIN: Manual Fixture Update (fallback) ═══
function applyFixtures(){
  try{
    var raw=document.getElementById("fx-input").value.trim();
    if(!raw){STATUS="❌ Empty input";rerender();return;}
    var fx=JSON.parse(raw);
    if(!Array.isArray(fx)){STATUS="❌ Must be a JSON array";rerender();return;}
    fx=validateFixtures(fx);
    var counts={};
    for(var lk in LG){
      var lf=fx.filter(function(f){return f.lg===lk;});
      if(lf.length>0){
        LG[lk].fx=lf.map(function(f){return{h:f.h,a:f.a,dt:f.dt,hW:f.hW||40,aW:f.aW||30,dW:f.dW||30,oddsSource:f.oddsSource||"estimated",
          lines:f.lines||[{l:1.5,oAm:-200,uAm:170},{l:2.5,oAm:-110,uAm:-110},{l:3.5,oAm:190,uAm:-235}]};});
        counts[lk]=lf.length;
      }
    }
    // Save to localStorage so it persists
    localStorage.setItem("profitfc-fixtures",raw);
    DATA=runAll();
    STATUS="✅ "+fx.length+" fixtures loaded ("+Object.keys(counts).map(function(k){return k+":"+counts[k];}).join(", ")+")";
    ADMIN_VIEW=false;
    rerender();
    setTimeout(function(){STATUS="";rerender();},6000);
  }catch(e){STATUS="❌ JSON error: "+e.message;rerender();}
}

// ═══ ADMIN: Check Results ═══

    var results=JSON.parse(raw);

    var d2=buildOUData();var aF2=Array.from({length:35},function(_,i){return i;});
    var md2={dt:bTree(d2,0,7,aF2),rf:bForest(d2,45,5,42)};

      var hT2=getT(r.h),aT2=getT(r.a);if(!hT2||!aT2)return;
