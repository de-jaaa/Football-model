      if(!p2)return;
      var tG=(r.hg||0)+(r.ag||0);var b2=(p2.linePicks&&p2.linePicks[0])||{line:2.5,dir:"OVER",ev:0,prob:50,impl:50};
      var t2=ouTier(b2.ev||0,p2.overVotes||0,(b2.prob||50)-(b2.impl||50));
      var lp25=p2.linePicks?p2.linePicks.find(function(l){return l.line===2.5;}):null;
      if(lp25){var mD=(lp25.oProb||50)>(lp25.uProb||50)?"OVER":"UNDER";var aD=tG>2.5?"OVER":"UNDER";oT++;if(mD===aD)oW++;}
      var mlD2=(p2.hw||0)>(p2.aw||0)?((p2.hw||0)>(p2.dr||0)?"H":"D"):((p2.aw||0)>(p2.dr||0)?"A":"D");
      var aML=r.hg>r.ag?"H":(r.hg<r.ag?"A":"D");mT++;if(mlD2===aML)mW++;
      if(t2.t>=2){pT++;if(b2.dir==="OVER"?tG>b2.line:tG<b2.line)pW++;}
      var mB=(p2.btts||50)>50;var aB=r.hg>0&&r.ag>0;bT++;if(mB===aB)bW++;ck++;
      TRK.hist.push({h:r.h,a:r.a,hg:r.hg,ag:r.ag,ouPick:b2.dir+" "+b2.line,ouHit:b2.dir==="OVER"?tG>b2.line:tG<b2.line,mlPick:mlD2,mlHit:mlD2===aML,tier:t2.t,date:new Date().toISOString().split("T")[0]});
    });
    TRK.ouT+=oT;TRK.ouW+=oW;TRK.mlT+=mT;TRK.mlW+=mW;TRK.prT+=pT;TRK.prW+=pW;TRK.btT+=bT;TRK.btW+=bW;
    saveTrk();
    STATUS="✅ "+ck+" results verified. O/U: "+oW+"/"+oT+" ML: "+mW+"/"+mT;
    ADMIN_VIEW=false;TRACKER_VIEW=true;
    rerender();
    setTimeout(function(){STATUS="";rerender();},8000);
  }catch(e){STATUS="❌ "+e.message;rerender();}
}

// ═══ FIXTURE VALIDATION ═══
function validateFixtures(allFx){
  var clean=[];var seen={};var teamDates={};
  allFx.forEach(function(f){
    var k=f.h+"_"+f.a+"_"+f.dt;
    if(seen[k])return;seen[k]=true;
    // Check team not already playing that day in same league
    var hKey=f.lg+"_"+f.dt+"_"+f.h;var aKey=f.lg+"_"+f.dt+"_"+f.a;
    if(teamDates[hKey]||teamDates[aKey])return;
    teamDates[hKey]=true;teamDates[aKey]=true;
    clean.push(f);
  });
  return clean;
}

// ═══ INIT ═══
(function(){
  loadTrk();
  // Check if returning from Whop payment redirect
  var justPaid=checkUrlUnlock();
  // Try loading newer fixtures from localStorage
  try{
    var saved=localStorage.getItem("profitfc-fixtures");
    if(saved){
      var fx=validateFixtures(JSON.parse(saved));
      for(var lk in LG){var lf=fx.filter(function(f){return f.lg===lk;});
        if(lf.length>0)LG[lk].fx=lf.map(function(f){return{h:f.h,a:f.a,dt:f.dt,hW:f.hW||40,aW:f.aW||30,dW:f.dW||30,oddsSource:f.oddsSource||"estimated",lines:f.lines||[{l:1.5,oAm:-200,uAm:170},{l:2.5,oAm:-110,uAm:-110},{l:3.5,oAm:190,uAm:-235}]};});}
    }
  }catch(e){}
  // Always render immediately with whatever fixtures we have (hardcoded or saved)
  try{DATA=runAll();}catch(e){DATA={picks:[]};}
  // If returning from Whop payment, go straight to dashboard
  if(justPaid){MODE="app";renderApp();}
  else{renderLanding();}
  // ═══ AUTO-REFRESH ON LOAD ═══
  // If fixture data is >12hrs old OR all matches are in the past, silently fetch fresh data.
  // On deployed sites, TheSportsDB API works directly. In Claude preview, AI fallback kicks in.
  var lastUp=localStorage.getItem("profitfc-lastupdate");
  var stale=!lastUp||(new Date()-new Date(lastUp))>43200000; // 12hrs
  var allPast=DATA.picks.length>0&&DATA.picks.every(function(p){return p.dg==="prev";});
  if(allPast||stale){
    setTimeout(function(){
      autoFetchFixtures(true).catch(function(){});
    },800);
  }
  // ═══ Start live match polling (every 60s) if API key present ═══
  setTimeout(function(){startLivePolling();},2000);
  // ═══ Auto-grade finished matches once on load ═══
  setTimeout(function(){
    if(API_FOOTBALL_KEY&&API_FOOTBALL_KEY!=="PASTE_YOUR_KEY_HERE"){
      autoGradeFromApiFootball().then(function(g){
        if(g>0){rerender();}
      }).catch(function(){});
    }
  },3000);
  // ═══ Refresh team stats (form, W/D/L, goals) from API-Football ═══
  // Runs once per page load if data is stale (>6hrs old).
  // Updates LG[league].t[] so the model uses CURRENT team form.
  setTimeout(function(){
    if(API_FOOTBALL_KEY&&API_FOOTBALL_KEY!=="PASTE_YOUR_KEY_HERE"){
      var statsLastUp=localStorage.getItem("profitfc-stats-lastrun");
      var statsStale=!statsLastUp||(Date.now()-parseInt(statsLastUp))>21600000; // 6hrs
      if(statsStale){
        refreshAllTeamStats().then(function(n){
          localStorage.setItem("profitfc-stats-lastrun",Date.now().toString());
        }).catch(function(){});
      }
    }
  },5000);
})();
